<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title subtitle">
  <title id="title">Fly High hero preview</title>
  <desc id="subtitle">Illustration of the Fly High travel web app hero section with navigation, search, and featured cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="100%" stop-color="#fbe9d3" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff1e3" />
    </linearGradient>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)" />
  <rect x="60" y="40" width="1080" height="90" rx="28" fill="#ffffff" opacity="0.95" />
  <circle cx="110" cy="86" r="24" fill="#ff7c4d" opacity="0.95" />
  <path d="M128 80 L148 100 L128 120" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" />
  <text x="160" y="96" font-family="Manrope, sans-serif" font-size="30" fill="#3c2f2a" font-weight="700">FlyHigh</text>
  <rect x="120" y="170" width="540" height="340" rx="36" fill="url(#cardGradient)" stroke="#f2d0b4" stroke-width="2" />
  <text x="160" y="240" font-family="Manrope, sans-serif" font-size="52" fill="#3d2b22" font-weight="800">Travel with better taste</text>
  <text x="160" y="300" font-family="Manrope, sans-serif" font-size="22" fill="#5f4a3f" opacity="0.9">Search destinations, get weather insights, save favorites, and explore curated travel ideas.</text>
  <rect x="160" y="360" width="420" height="56" rx="28" fill="#fff" stroke="#e9c7ae" stroke-width="2" />
  <text x="180" y="395" font-family="Manrope, sans-serif" font-size="20" fill="#8f7a6b" opacity="0.95">Search cities, beaches, mountains...</text>
  <rect x="620" y="180" width="460" height="110" rx="24" fill="#ffffff" opacity="0.95" stroke="#f2d0b4" stroke-width="2" />
  <text x="640" y="225" font-family="Manrope, sans-serif" font-size="24" fill="#3c2f2a" font-weight="700">Trending starts here</text>
  <text x="640" y="260" font-family="Manrope, sans-serif" font-size="18" fill="#8f7a6b">Romantic cities · Luxury beaches · Mountain escapes</text>
  <g fill="#fff" opacity="0.96">
    <rect x="640" y="310" width="200" height="60" rx="20" fill="#ff8f5a" />
    <rect x="860" y="310" width="180" height="60" rx="20" fill="#f3c494" />
  </g>
  <text x="675" y="350" font-family="Manrope, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Start exploring</text>
  <text x="885" y="350" font-family="Manrope, sans-serif" font-size="18" fill="#7b523d" font-weight="700">View trending</text>
  <rect x="120" y="530" width="280" height="70" rx="24" fill="#ffffff" opacity="0.95" stroke="#f2d0b4" stroke-width="2" />
  <rect x="440" y="530" width="280" height="70" rx="24" fill="#ffffff" opacity="0.95" stroke="#f2d0b4" stroke-width="2" />
  <rect x="760" y="530" width="280" height="70" rx="24" fill="#ffffff" opacity="0.95" stroke="#f2d0b4" stroke-width="2" />
  <text x="150" y="575" font-family="Manrope, sans-serif" font-size="20" fill="#7b523d">Fast search</text>
  <text x="470" y="575" font-family="Manrope, sans-serif" font-size="20" fill="#7b523d">Save favorites</text>
  <text x="790" y="575" font-family="Manrope, sans-serif" font-size="20" fill="#7b523d">Theme switch</text>
</svg>
