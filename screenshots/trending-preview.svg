<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title subtitle">
  <title id="title">Trending destinations preview</title>
  <desc id="subtitle">Illustration of the trending destinations section from the Fly High app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6ed" />
      <stop offset="100%" stop-color="#f6e2d0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="650" rx="30" fill="url(#bg)" />
  <rect x="80" y="70" width="1040" height="510" rx="36" fill="#fff" stroke="#ebd5c4" stroke-width="2" opacity="0.95" />
  <text x="120" y="135" font-family="Manrope, sans-serif" font-size="32" fill="#3d2d24" font-weight="700">Trending Destinations</text>
  <text x="120" y="170" font-family="Manrope, sans-serif" font-size="18" fill="#7f6250">A richer starting point for travelers who want ideas that already feel vivid.</text>
  <g fill="#fff" stroke="#f3c6a5" stroke-width="2">
    <rect x="120" y="210" width="320" height="180" rx="28" />
    <rect x="430" y="210" width="320" height="180" rx="28" />
    <rect x="740" y="210" width="320" height="180" rx="28" />
  </g>
  <text x="150" y="260" font-family="Manrope, sans-serif" font-size="21" fill="#5f4332" font-weight="700">Kyoto</text>
  <text x="150" y="290" font-family="Manrope, sans-serif" font-size="16" fill="#856a5a">Cultural calm · Japan</text>
  <text x="460" y="260" font-family="Manrope, sans-serif" font-size="21" fill="#5f4332" font-weight="700">Marrakech</text>
  <text x="460" y="290" font-family="Manrope, sans-serif" font-size="16" fill="#856a5a">Warm texture · Morocco</text>
  <text x="770" y="260" font-family="Manrope, sans-serif" font-size="21" fill="#5f4332" font-weight="700">Bali</text>
  <text x="770" y="290" font-family="Manrope, sans-serif" font-size="16" fill="#856a5a">Tropical reset · Indonesia</text>
  <rect x="120" y="410" width="320" height="130" rx="28" fill="#fff0e4" stroke="#f3c6a5" stroke-width="1" />
  <rect x="430" y="410" width="320" height="130" rx="28" fill="#fff0e4" stroke="#f3c6a5" stroke-width="1" />
  <rect x="740" y="410" width="320" height="130" rx="28" fill="#fff0e4" stroke="#f3c6a5" stroke-width="1" />
  <text x="150" y="450" font-family="Manrope, sans-serif" font-size="18" fill="#5f4332">Best For</text>
  <text x="150" y="480" font-family="Manrope, sans-serif" font-size="16" fill="#856a5a">Temples, gardens, and quiet streets</text>
  <text x="460" y="450" font-family="Manrope, sans-serif" font-size="18" fill="#5f4332">Best For</text>
  <text x="460" y="480" font-family="Manrope, sans-serif" font-size="16" fill="#856a5a">Courtyards, markets, and riads</text>
  <text x="770" y="450" font-family="Manrope, sans-serif" font-size="18" fill="#5f4332">Best For</text>
  <text x="770" y="480" font-family="Manrope, sans-serif" font-size="16" fill="#856a5a">Beach clubs, surf, and villas</text>
</svg>