<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title subtitle">
  <title id="title">Saved Destinations preview</title>
  <desc id="subtitle">Illustration of the Fly High saved destinations and favorites section.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7f0" />
      <stop offset="100%" stop-color="#f8e6d3" />
    </linearGradient>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)" />
  <rect x="90" y="70" width="1020" height="500" rx="36" fill="#ffffff" stroke="#eac7af" stroke-width="2" opacity="0.95" />
  <text x="130" y="135" font-family="Manrope, sans-serif" font-size="34" fill="#3f2f26" font-weight="700">Saved Destinations</text>
  <text x="130" y="175" font-family="Manrope, sans-serif" font-size="20" fill="#8a7060">Collect your favorite places with weather, wiki, and quick actions.</text>
