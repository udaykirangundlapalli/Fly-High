  <text x="150" y="290" font-family="Manrope, sans-serif" font-size="16" fill="#a17a62">Clear · 24°C</text>
  <text x="390" y="260" font-family="Manrope, sans-serif" font-size="19" fill="#7d5a48" font-weight="700">Kyoto</text>
  <text x="390" y="290" font-family="Manrope, sans-serif" font-size="16" fill="#a17a62">Cloudy · 19°C</text>
