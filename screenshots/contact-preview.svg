<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title subtitle">
  <title id="title">Contact form preview</title>
  <desc id="subtitle">Illustration of the Fly High contact section with message form.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf7ef" />
      <stop offset="100%" stop-color="#f7e5d6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="650" rx="30" fill="url(#bg)" />
  <rect x="80" y="80" width="1040" height="500" rx="36" fill="#ffffff" stroke="#ecd1b9" stroke-width="2" opacity="0.96" />
  <text x="120" y="145" font-family="Manrope, sans-serif" font-size="32" fill="#3b2d24" font-weight="700">Stay connected</text>
  <text x="120" y="180" font-family="Manrope, sans-serif" font-size="18" fill="#7c624f">Plan your next journey with confidence using the contact form.</text>
  <g fill="#fff" stroke="#f4c9a8" stroke-width="2">
    <rect x="120" y="230" width="460" height="60" rx="22" />
    <rect x="120" y="310" width="460" height="60" rx="22" />
    <rect x="120" y="390" width="460" height="140" rx="22" />
    <rect x="120" y="550" width="220" height="54" rx="27" fill="#ff8e58" stroke="#ff8e58" />
  </g>
  <text x="140" y="270" font-family="Manrope, sans-serif" font-size="18" fill="#6c5141">Full Name</text>
  <text x="140" y="350" font-family="Manrope, sans-serif" font-size="18" fill="#6c5141">Email Address</text>
  <text x="140" y="440" font-family="Manrope, sans-serif" font-size="18" fill="#6c5141">Your Message</text>
  <text x="170" y="585" font-family="Manrope, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Send Message</text>
  <rect x="620" y="240" width="380" height="120" rx="24" fill="#fff7f0" stroke="#f4c9a8" stroke-width="1" />
  <text x="640" y="280" font-family="Manrope, sans-serif" font-size="20" fill="#5f4433" font-weight="700">Fast inspiration</text>
  <text x="640" y="305" font-family="Manrope, sans-serif" font-size="16" fill="#876d57">Search, save, and compare in minutes.</text>
  <rect x="620" y="390" width="380" height="120" rx="24" fill="#fff7f0" stroke="#f4c9a8" stroke-width="1" />
  <text x="640" y="430" font-family="Manrope, sans-serif" font-size="20" fill="#5f4433" font-weight="700">Better context</text>
  <text x="640" y="455" font-family="Manrope, sans-serif" font-size="16" fill="#876d57">Open maps and summaries without leaving the page.</text>
</svg>