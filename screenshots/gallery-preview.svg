<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title subtitle">
  <title id="title">Traveler Gallery preview</title>
  <desc id="subtitle">Illustration of the Fly High gallery section with moodboard image cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8" />
      <stop offset="100%" stop-color="#f7eadf" />
    </linearGradient>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)" />
  <rect x="80" y="80" width="1040" height="480" rx="36" fill="#ffffff" stroke="#ebd2bb" stroke-width="2" opacity="0.96" />
  <text x="120" y="145" font-family="Manrope, sans-serif" font-size="34" fill="#3e2f27" font-weight="700">Traveler Gallery</text>
  <text x="120" y="185" font-family="Manrope, sans-serif" font-size="20" fill="#8c7661">Browse curated inspiration cards for scenic escapes and city vibes.</text>
  <g fill="#f8e3d3" stroke="#f2c7af" stroke-width="2">
    <rect x="120" y="230" width="300" height="180" rx="26" />
    <rect x="460" y="230" width="300" height="180" rx="26" />
    <rect x="800" y="230" width="300" height="180" rx="26" />
  </g>
  <text x="150" y="280" font-family="Manrope, sans-serif" font-size="18" fill="#7b523f" font-weight="700">Coastal escapes</text>
  <text x="490" y="280" font-family="Manrope, sans-serif" font-size="18" fill="#7b523f" font-weight="700">City nights</text>
  <text x="830" y="280" font-family="Manrope, sans-serif" font-size="18" fill="#7b523f" font-weight="700">Mountain trails</text>
  <text x="150" y="320" font-family="Manrope, sans-serif" font-size="16" fill="#987861">River beaches, boardwalk views.</text>
  <text x="490" y="320" font-family="Manrope, sans-serif" font-size="16" fill="#987861">Urban design, cafes, culture.</text>
  <text x="830" y="320" font-family="Manrope, sans-serif" font-size="16" fill="#987861">High peaks, lakes, lodges.</text>
  <rect x="130" y="440" width="260" height="40" rx="20" fill="#fff" stroke="#f2cab5" stroke-width="1" />
  <rect x="470" y="440" width="260" height="40" rx="20" fill="#fff" stroke="#f2cab5" stroke-width="1" />
  <rect x="810" y="440" width="260" height="40" rx="20" fill="#fff" stroke="#f2cab5" stroke-width="1" />
  <text x="190" y="470" font-family="Manrope, sans-serif" font-size="16" fill="#7b523f">Tap to explore</text>
  <text x="530" y="470" font-family="Manrope, sans-serif" font-size="16" fill="#7b523f">Tap to explore</text>
  <text x="870" y="470" font-family="Manrope, sans-serif" font-size="16" fill="#7b523f">Tap to explore</text>
</svg>
